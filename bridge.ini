; Unity Python Bridge 配置文件
; 本文件存放工具的运行时默认参数，供 Python CLI 与 Unity(C#) 两侧共同读取。

[server]
; TCP 监听/连接端口。
; C# 服务器启动时读取此值作为监听端口；Python CLI 把它作为 --port 默认值。
; 命令行显式传入 --port 时会覆盖本值。
port = 21927

[reload]
; 触发 Unity 重编译（bridge.reload）后，轮询等待服务器恢复的总超时时间（秒）。
; 命令行传入 --timeout 时会覆盖本值。
timeout = 30

[scene]
; 重要脚本匹配规则（scene.important_scripts 命令使用）：
; 脚本类名以这些后缀之一结尾即视为"重要脚本"，逗号分隔，可自由增删。
; 例：important_suffix = Manager, Tool
important_suffix = Manager, Tool
